name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Create environment variables file
      shell: bash
      run: |
        cat << EOF > .env
        DATABASE_URL="postgresql://postgres:password@localhost:5432/blog"
        BETTER_AUTH_URL="http://localhost:3000"
        BETTER_AUTH_SECRET="dummy_secret"
        GOOGLE_CLIENT_ID="dummy_client_id"
        GOOGLE_CLIENT_SECRET="dummy_client_secret"
        NEXT_PUBLIC_UMAMI_URL="https://umami.example.com"
        NEXT_PUBLIC_UMAMI_WEBSITE_ID="00000000-0000-0000-0000-000000000000"
        VERCEL_PROJECT_PRODUCTION_URL="example.vercel.app"
        NEXT_PUBLIC_APP_URL="http://localhost:3000"
        EOF
