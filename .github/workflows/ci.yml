name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  secrets:
    name: Security gate (no secrets, keys or internal files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run security gate
        run: python3 scripts/security-gate.py

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm check

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run links check
        run: pnpm check:links

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run spelling check
        run: pnpm check:spelling

  contracts:
    name: Contracts release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Clean contract install
        working-directory: contracts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      - name: Unit tests
        working-directory: contracts
        run: npm run test:unit

      - name: Integration tests
        working-directory: contracts
        run: npm run test:integration

      - name: Fuzz tests
        working-directory: contracts
        run: npm run test:fuzzing

      - name: Deployment simulation
        working-directory: contracts
        run: npm run test:deploy

      - name: Production dependency audit
        working-directory: contracts
        run: npm audit --omit=dev --audit-level=high

  production-dependency-audit:
    name: Root production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit root production dependencies
        run: pnpm audit --prod --audit-level=high
